<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Escape the Elevator — The Giraffe Club</title>
<style>
  :root{ --w:1280px; --h:720px; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#1a1410; overflow:hidden;
    font-family:Georgia,'Times New Roman',serif; color:#f0e6d2; }
  #stage{ position:absolute; left:50%; top:50%; width:var(--w); height:var(--h);
    transform:translate(-50%,-50%); transform-origin:center center; background:#000;
    overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,.8); }
  .scene{ position:absolute; inset:0; display:none; }
  .scene.active{ display:block; }
  .scene img{ position:absolute; inset:0; width:100%; height:100%;
    object-fit:fill; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  .scene img.click.debug{ outline:2px dashed rgba(0,255,255,.6); }
  .nav{ position:absolute; z-index:75; display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,.5); cursor:pointer; user-select:none; font-family:Georgia,serif; }
  .nav:hover{ color:#ffd54a; }
  .nav.lr{ top:34%; height:32%; width:9%; font-size:60px; }
  .nav.ud{ left:34%; width:32%; height:9%; font-size:46px; }
  .nav.ud.down{ bottom:98px; }
  .nav.ud.up{ top:0; }
  .navback{ position:absolute; left:14px; top:14px; z-index:80; cursor:pointer;
    background:rgba(0,0,0,.55); border:1px solid #b8932f; color:#f0e6d2;
    padding:8px 14px; border-radius:6px; font-size:15px; }
  .navback:hover{ background:rgba(40,30,15,.85); }
  #inv{ position:absolute; left:0; right:0; bottom:0; height:96px; z-index:70;
    background:linear-gradient(180deg,rgba(20,15,8,0),rgba(20,15,8,.85) 40%);
    display:flex; align-items:center; gap:10px; padding:0 16px 10px; pointer-events:none; }
  .slot{ width:74px; height:74px; border:2px solid #7a5e22; border-radius:8px;
    background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative; pointer-events:auto; }
  .slot img{ position:static; width:96%; height:96%; object-fit:contain; pointer-events:none; }
  .slot.selected{ border-color:#ffd54a; box-shadow:0 0 14px #ffd54a; background:rgba(80,60,15,.5); }
  .slot .lbl{ position:absolute; bottom:-2px; left:0; right:0; text-align:center;
    font-size:9px; color:#d8c79a; pointer-events:none; }
  #stage.using{ cursor:crosshair; }
  #stage{ cursor:default; }
  #toast{ position:absolute; left:50%; bottom:104px; transform:translateX(-50%);
    z-index:90; max-width:78%; background:rgba(15,11,6,.94); border:1px solid #b8932f;
    border-radius:10px; padding:14px 18px; font-size:18px; line-height:1.35;
    text-align:center; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show{ opacity:1; }
  #phoneReadout{ position:absolute; z-index:60; left:50%; top:16px; transform:translateX(-50%);
    background:#1c2417; color:#7CFC4E; border:2px solid #0a0f08; border-radius:6px;
    font-family:'Courier New',monospace; font-size:30px; letter-spacing:6px;
    padding:6px 22px; min-width:160px; text-align:center; display:none;
    box-shadow:inset 0 0 12px rgba(0,0,0,.7); }
  #safeReadout{ position:absolute; z-index:60; display:none;
    background:#1c2417; color:#7CFC4E; border:2px solid #0a0f08; border-radius:5px;
    font-family:'Courier New',monospace; letter-spacing:6px; text-align:center;
    box-shadow:inset 0 0 10px rgba(0,0,0,.7); }
  #rotate{ position:fixed; inset:0; z-index:9999; background:#0d0a06; color:#f0e6d2;
    display:none; align-items:center; justify-content:center; text-align:center;
    flex-direction:column; gap:14px; padding:30px; }
  #rotate svg{ width:70px; height:70px; animation:rot 1.6s ease-in-out infinite; }
  @keyframes rot{ 0%,40%{transform:rotate(0)} 60%,100%{transform:rotate(-90deg)} }
  @media (max-aspect-ratio:1/1){ #rotate.maybe{ display:flex; } }
  #win{ position:absolute; inset:0; z-index:200; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center;
    background:radial-gradient(circle at 50% 40%,#3a2c10,#0d0a06); }
  #win h1{ font-size:46px; margin:0; color:#ffd54a; letter-spacing:2px; }
  #win p{ font-size:20px; max-width:60%; margin:0; }
  #win button{ margin-top:10px; font-size:18px; padding:12px 26px; cursor:pointer;
    background:#b8932f; border:none; border-radius:8px; color:#1a1410; font-weight:bold; }
  #dbg{ position:absolute; right:10px; top:10px; z-index:300; font-size:11px;
    background:rgba(0,0,0,.4); color:#9fb; border:1px solid #244; border-radius:5px;
    padding:4px 8px; cursor:pointer; opacity:.5; }
  /* name-entry popup */
  #namePrompt{ position:absolute; inset:0; z-index:250; display:none;
    align-items:center; justify-content:center; background:rgba(8,6,3,.6); }
  #namePrompt.show{ display:flex; }
  .np-box{ width:min(420px,80%); background:#15110a; border:2px solid #b8932f;
    border-radius:12px; padding:24px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .np-title{ font-family:Georgia,serif; font-size:14px; letter-spacing:.2em; text-transform:uppercase;
    color:#ffd54a; margin-bottom:12px; }
  .np-msg{ font-size:18px; line-height:1.4; color:#f0e6d2; margin-bottom:18px; }
  #nameInput{ width:100%; padding:12px 14px; font-size:18px; font-family:Georgia,serif;
    border:1px solid #7a5e22; border-radius:8px; background:#0c0a06; color:#fff; outline:none; }
  #nameInput:focus{ border-color:#ffd54a; }
  .np-row{ display:flex; gap:10px; margin-top:18px; }
  .np-row button{ flex:1; padding:12px; font-size:15px; font-family:Georgia,serif; cursor:pointer;
    border-radius:8px; border:1px solid #7a5e22; background:#241a06; color:#f0e6d2; }
  #nameOk{ background:#b8932f; color:#1a1410; font-weight:bold; border-color:#b8932f; }
  .np-row button:hover{ filter:brightness(1.15); }
</style>

      </div>

</div>

<script>
const IMG='images/';
const stage=document.getElementById('stage');
const invEl=document.getElementById('inv');
const toastEl=document.getElementById('toast');
const phoneReadout=document.getElementById('phoneReadout');
const safeReadout=document.getElementById('safeReadout');

let actx;
function beep(f=440,d=0.07,t='square',v=0.05){
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=t;o.frequency.value=f;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(v,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);
    o.start();o.stop(actx.currentTime+d);}catch(e){}
}
const sfx={
  click(){beep(520,.05,'square',.04)},
  pickup(){beep(680,.08,'triangle',.06);setTimeout(()=>beep(900,.08,'triangle',.06),70)},
  key(){beep(300,.05,'square',.05);setTimeout(()=>beep(440,.12,'square',.05),60)},
  good(){beep(523,.1,'sine',.06);setTimeout(()=>beep(784,.16,'sine',.06),100)},
  bad(){beep(180,.18,'sawtooth',.05)},
  phone(){beep(440,.04,'square',.04)},
  win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,'sine',.07),i*140))}
};

const S={
  adminMode:false,
  has:{key:false,bluekey:false,screwdriver:false,telescope:false,card:false,directory:false,envelope:false},
  using:null,
  screws:{tl:false,tr:false,bl:false,br:false},
  grateOff:false, ventLooted:false, envelopeOpened:false, rugPeeled:false,
  knowsCoatNum:false, statueSeen:false,
  framePieceOff:false, keyholeRevealed:false, safeUnlocked:false, safeOpen:false,
  pickedKeyFromFloor:false, pickedTelescope:false, pickedDirectory:false,
  screwdriverOnFloor:false,
  _posterSeen:false,
};
const ANS={ maintenanceCode:'732', elevatorNum:'72561', coatNum:'57', finalCall:'5742', safeCombo:'1337' };
let phoneBuf='', safeBuf='', dialState=null;

function toast(m,ms=2800){ toastEl.innerHTML=m; toastEl.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),ms); }

const _alphaCache={};
const AW=640, AH=360;
function makeImg(file, onClick){
  const i=document.createElement('img');
  i.src=IMG+file; i.draggable=false;
  if(onClick){
    i.className='click'+(DEBUG?' debug':'');
    i._onClick=onClick;   // store handler; scene-level dispatcher will call it
  }
  return i;
}
function cacheKey(src){ return src.split('/').pop(); }
function alphaAt(imgEl,nx,ny){
  if(!imgEl.complete || imgEl.naturalWidth===0) return 255;
  const key=cacheKey(imgEl.src);
  let c=_alphaCache[key];
  if(!c){
    try{
      const cv=document.createElement('canvas'); cv.width=AW; cv.height=AH;
      const ctx=cv.getContext('2d'); ctx.drawImage(imgEl,0,0,AW,AH);
      c=ctx.getImageData(0,0,AW,AH).data; _alphaCache[key]=c;
    }catch(err){ return 255; }
  }
  const px=Math.min(AW-1,Math.max(0,Math.floor(nx*AW)));
  const py=Math.min(AH-1,Math.max(0,Math.floor(ny*AH)));
  return c[(py*AW+px)*4+3];
}
// single dispatcher on the stage: find topmost interactive layer with an opaque pixel under the click
function sceneClick(e){
  const sceneDiv=stage.querySelector('.scene.active');
  if(!sceneDiv) return;
  const imgs=[...sceneDiv.querySelectorAll('img.click')];
  // topmost = last in DOM; iterate in reverse
  for(let k=imgs.length-1;k>=0;k--){
    const img=imgs[k]; const r=img.getBoundingClientRect();
    const nx=(e.clientX-r.left)/r.width, ny=(e.clientY-r.top)/r.height;
    if(nx<0||ny<0||nx>1||ny>1) continue;
    if(alphaAt(img,nx,ny)>20){ if(img._onClick){ img._onClick(e); } return; }
  }
}

const SCENES={
  front:{
    nav:{ left:'left', right:'right', up:'ceiling', down:'floor' },
    layers:[
      {f:'front_wall__front_wall.png'},
      {f:'front_wall__elevator.png'},
      {f:'front_wall__elevator_dialpad.png', click:()=>go('dialpad')},
      {f:'front_wall__red_wire.png'},
      {f:'front_wall__graffiti.png'},
    ],
  },
  dialpad:{ isPhone:true, back:'front',
    layers:[
      {f:'elevator_dialpad__background_1.png'},
      {f:'elevator_dialpad__red_wire.png'},
      {f:'elevator_dialpad__keyhole.png', click:()=>useKeyhole()},
      {f:'elevator_dialpad__call.png', click:()=>phoneAction('call')},
      {f:'elevator_dialpad__x.png', click:()=>phoneAction('clear')},
      {f:'elevator_dialpad__1.png', click:()=>phoneDigit('1')},
      {f:'elevator_dialpad__2.png', click:()=>phoneDigit('2')},
      {f:'elevator_dialpad__3.png', click:()=>phoneDigit('3')},
      {f:'elevator_dialpad__4.png', click:()=>phoneDigit('4')},
      {f:'elevator_dialpad__5.png', click:()=>phoneDigit('5')},
      {f:'elevator_dialpad__6.png', click:()=>phoneDigit('6')},
      {f:'elevator_dialpad__7.png', click:()=>phoneDigit('7')},
      {f:'elevator_dialpad__8.png', click:()=>phoneDigit('8')},
      {f:'elevator_dialpad__l.png', click:()=>phoneDigit('L')},
    ],
  },
  floor:{ nav:{ up:'front' },
    layers:[
      {f:'floor__background_1.png'},
      // torn carpet corner: click to peel it back and reveal the key underneath
      {f:'floor__rug_unpeeled.png', when:()=>!S.rugPeeled, click:()=>{ S.rugPeeled=true; sfx.click(); render(); }},
      {f:'floor__rug_peeled.png', when:()=>S.rugPeeled},
      // key only visible/clickable once the carpet is peeled
      {f:'floor__key_ground.png', when:()=>S.rugPeeled && !S.pickedKeyFromFloor, click:()=>{ S.pickedKeyFromFloor=true; S.has.key=true; sfx.pickup(); render(); }},
      {f:'floor__telescope.png', when:()=>!S.pickedTelescope, click:()=>{ S.pickedTelescope=true; S.has.telescope=true; sfx.pickup(); render(); }},
      // directory card: pick it up into inventory
      {f:'floor__directory.png', when:()=>!S.pickedDirectory, click:()=>{ S.pickedDirectory=true; S.has.directory=true; sfx.pickup(); render(); }},
      // screwdriver dropped through the chute, lands on the floor
      {f:'floor__screwdriver.png', when:()=>S.screwdriverOnFloor && !S.has.screwdriver, click:()=>{ S.has.screwdriver=true; sfx.pickup(); render(); }},
    ],
  },
  left:{ nav:{ left:'back', right:'front' },
    layers:[
      {f:'left_wall__left_wall.png'},
      {f:'left_wall__poster.png', click:()=>{ S._posterSeen=true; toast('A poster for the Fren Party.'); }},
      {f:'left_wall__tell_them_justin_called.png'},
    ],
  },
  back:{ nav:{ left:'right', right:'left' },
    layers:[
      {f:'back_wall__background_1.png'},
      {f:'back_wall__window.png', click:()=>{
        if(S.using==='telescope'){ clearUsing(); go('telescope'); }
        else { toast('A window looking out on the gardens.'); }
      }},
      {f:'back_wall__emergency_chute.png', click:()=>{
        toast('An emergency supply chute leading down to the floor.');
      }},
    ],
  },
  telescope:{ back:'back',
    layers:[
      {f:'back_wall_telescope__background_1.png', click:()=>{ S.statueSeen=true; }},
    ],
  },
  right:{ nav:{ left:'front', right:'back' },
    layers:[
      {f:'right_wall__right_wall.png'},
      {f:'right_wall__red_wire.png'},
      {f:'right_wall__giraffe_portrait.png', click:()=>go('safe')},
    ],
  },
  safe:{ back:'right', isSafe:true,
    layers:[
      {f:'right_wall_zoomed__background_1.png'},
      {f:'right_wall_zoomed__wire.png'},
      {f:'right_wall_zoomed__painting.png', when:()=>!S.safeUnlocked && !S.safeOpen},
      {f:'right_wall_zoomed__frame_piece.png', when:()=>!S.framePieceOff && !S.safeUnlocked && !S.safeOpen, click:()=>{
        S.framePieceOff=true; S.keyholeRevealed=true; sfx.click();
        render();
      }},
      {f:'right_wall_zoomed__keyhole.png', when:()=>S.keyholeRevealed && !S.safeUnlocked && !S.safeOpen, click:()=>{
        if(S.using==='bluekey'){ S.safeUnlocked=true; clearUsing(); sfx.key(); toast('The blue key turns. The painting swings aside revealing a safe.'); render(); }
        else if(S.using==='key'){ sfx.bad(); toast('That key doesn’t fit this lock.'); }
        else { toast('A keyhole.'); }
      }},
      {f:'right_wall_zoomed__safe_closed.png', when:()=>S.safeUnlocked && !S.safeOpen},
      {f:'right_wall_zoomed__pin_pad.png', when:()=>S.safeUnlocked && !S.safeOpen},
      {f:'right_wall_zoomed__1.png', when:()=>S.safeUnlocked&&!S.safeOpen, click:()=>safeDigit('1')},
      {f:'right_wall_zoomed__2.png', when:()=>S.safeUnlocked&&!S.safeOpen, click:()=>safeDigit('2')},
      {f:'right_wall_zoomed__3.png', when:()=>S.safeUnlocked&&!S.safeOpen, click:()=>safeDigit('3')},
      {f:'right_wall_zoomed__4.png', when:()=>S.safeUnlocked&&!S.safeOpen, click:()=>safeDigit('4')},
      {f:'right_wall_zoomed__5.png', when:()=>S.safeUnlocked&&!S.safeOpen, click:()=>safeDigit('5')},
      {f:'right_wall_zoomed__6.png', when:()=>S.safeUnlocked&&!S.safeOpen, click:()=>safeDigit('6')},
      {f:'right_wall_zoomed__7.png', when:()=>S.safeUnlocked&&!S.safeOpen, click:()=>safeDigit('7')},
      {f:'right_wall_zoomed__8.png', when:()=>S.safeUnlocked&&!S.safeOpen, click:()=>safeDigit('8')},
      {f:'right_wall_zoomed__9.png', when:()=>S.safeUnlocked&&!S.safeOpen, click:()=>safeDigit('9')},
      {f:'right_wall_zoomed__safe_open.png', when:()=>S.safeOpen},
      {f:'right_wall_zoomed__safe_door_open.png', when:()=>S.safeOpen},
      {f:'right_wall_zoomed__wire_inside_safe.png', when:()=>S.safeOpen},
      {f:'right_wall_zoomed__button_background.png', when:()=>S.safeOpen},
      {f:'right_wall_zoomed__button.png', when:()=>S.safeOpen, click:()=>winGame()},
    ],
  },
  // directory close-up: opened from inventory; back returns to where you were
  directory:{ backTo:()=>S._returnTo||'floor',
    layers:[
      {f:'directory__background_1.png'},
      {f:'directory__directory.png'},
    ],
  },
  // card close-up: the note from the envelope, opened from inventory

    layers:[

      {f:'letter_2__letter_note.png'},
    ],
  },
  // envelope page: click the closed envelope to open it and take the key + card.
  // Taking them consumes the envelope (it leaves your inventory).
  envelope:{ backTo:()=>S._returnTo||'ceiling',
    layers:[
      {f:'letter_2__background_1.png'},
      // closed envelope until opened
      {f:'letter_2__envelope.png', when:()=>!S.envelopeOpened, click:()=>{
        S.envelopeOpened=true; sfx.pickup(); render();
      }},
      // opened: show card + blue key; click each to collect
      {f:'letter_2__letter_note.png', when:()=>S.envelopeOpened && !S.has.card, click:()=>{ takeFromEnvelope('card'); }},
      {f:'letter_2__layer_7.png', when:()=>S.envelopeOpened && !S.has.bluekey, click:()=>{ takeFromEnvelope('bluekey'); }},
    ],
  },
  ceiling:{ nav:{ down:'front' },
    layers:[
      {f:'ceiling__background_1.png'},
      {f:'ceiling__elevator_and_decoration.png'},
      // grate (or grate-gone) sits under the screws
      {f:'ceiling__ceiling_grate.png', when:()=>!S.grateOff, click:()=>{
        if(S.screws.tl&&S.screws.tr&&S.screws.bl&&S.screws.br){ S.grateOff=true; sfx.good(); render(); }
        else { toast('The grate is still screwed down at the corners.'); }
      }},
      {f:'ceiling__grate_gone.png', when:()=>S.grateOff},
      {f:'ceiling__letter_in_grate.png', when:()=>S.grateOff && !S.ventLooted, click:()=>{
        S.ventLooted=true; S.has.envelope=true; sfx.pickup(); render();
      }},
      // screws on TOP of the grate so they're visible & clickable
      {f:'ceiling__tl_unscrewed.png', when:()=>S.screws.tl&&!S.grateOff},
      {f:'ceiling__tr_unscrewed.png', when:()=>S.screws.tr&&!S.grateOff},
      {f:'ceiling__bl_unscrewed.png', when:()=>S.screws.bl&&!S.grateOff},
      {f:'ceiling__br_unscrewed.png', when:()=>S.screws.br&&!S.grateOff},
      {f:'ceiling__tl_screwed.png', when:()=>!S.screws.tl&&!S.grateOff, click:()=>screw('tl')},
      {f:'ceiling__tr_screwed.png', when:()=>!S.screws.tr&&!S.grateOff, click:()=>screw('tr')},
      {f:'ceiling__bl_screwed.png', when:()=>!S.screws.bl&&!S.grateOff, click:()=>screw('bl')},
      {f:'ceiling__br_screwed.png', when:()=>!S.screws.br&&!S.grateOff, click:()=>screw('br')},
    ],
  },
};

let current='front', DEBUG=false;
function toggleDebug(){ DEBUG=!DEBUG; document.getElementById('dbg').textContent=DEBUG?'hide hotspots':'show hotspots'; render(); }

function render(){
  [...stage.querySelectorAll('.scene')].forEach(n=>n.remove());
  const sc=SCENES[current];
  const div=document.createElement('div'); div.className='scene active';
  sc.layers.forEach(L=>{
    if(L.when && !L.when()) return;
    div.appendChild(makeImg(L.f, L.click||null));
  });
  if(sc.nav){
    if(sc.nav.left) div.appendChild(mkNav('‹','lr','left', sc.nav.left));
    if(sc.nav.right) div.appendChild(mkNav('›','lr','right', sc.nav.right));
    if(sc.nav.up) div.appendChild(mkNav('⌃','ud','up', sc.nav.up));
    if(sc.nav.down) div.appendChild(mkNav('⌄','ud','down', sc.nav.down));
  }
  const backTarget = sc.back || (sc.backTo ? sc.backTo() : null);
  if(backTarget){ const bk=document.createElement('div'); bk.className='navback'; bk.textContent='‹ Back';
    bk.onclick=()=>{ sfx.click(); go(backTarget); }; div.appendChild(bk); }
  stage.insertBefore(div, phoneReadout);

  phoneReadout.style.display=sc.isPhone?'block':'none';
  if(sc.isPhone) updatePhoneReadout();
  const showSafe=(sc.isSafe && S.safeUnlocked && !S.safeOpen);
  safeReadout.style.display=showSafe?'block':'none';
  if(showSafe){ positionSafeReadout(); updateSafeReadout(); }

  renderInv();
  stage.classList.toggle('using', !!S.using);
}
function mkNav(ch,kind,dir,target){
  const a=document.createElement('div'); a.className='nav '+kind+' '+dir;
  if(dir==='left') a.style.left='0';
  if(dir==='right') a.style.right='0';
  a.textContent=ch; a.onclick=()=>{ sfx.click(); go(target); };
  return a;
}

function renderInv(){
  invEl.innerHTML='';
  const items=[];
  if(S.has.key) items.push({id:'key', file:'icon_key.png', label:'Key'});
  if(S.has.bluekey) items.push({id:'bluekey', file:'icon_bluekey.png', label:'Blue Key'});
  if(S.has.telescope) items.push({id:'telescope', file:'icon_telescope.png', label:'Telescope'});
  if(S.has.screwdriver) items.push({id:'screwdriver', file:'icon_screwdriver.png', label:'Screwdriver'});
  if(S.has.envelope) items.push({id:'envelope', file:'icon_envelope.png', label:'Envelope'});
  if(S.has.card) items.push({id:'card', file:'icon_card.png', label:'Card'});
  if(S.has.directory) items.push({id:'directory', file:'icon_directory.png', label:'Directory'});
  items.forEach(it=>{
    const s=document.createElement('div'); s.className='slot'+(S.using===it.id?' selected':'');
    if(it.file){ const im=document.createElement('img'); im.src=IMG+it.file; s.appendChild(im); }
    else { s.textContent='🪛'; s.style.fontSize='30px'; }
    const l=document.createElement('div'); l.className='lbl'; l.textContent=it.label; s.appendChild(l);
    s.onclick=()=>{
      if(it.id==='directory' || it.id==='envelope' || it.id==='card'){
        if(current===it.id){ go(S._returnTo||'front'); } // already open -> close
        else {
          // don't let return point at another close-up (avoids nesting traps)
          S._returnTo = (current==='directory'||current==='envelope'||current==='card') ? (S._returnTo||'front') : current;
          go(it.id);
        }
        sfx.click(); return;
      }
      S.using=(S.using===it.id)?null:it.id; sfx.click(); render();
    };
    invEl.appendChild(s);
  });
}
function clearUsing(){ S.using=null; }

// ---------- coat check name prompt ----------
const namePrompt=document.getElementById('namePrompt');
const nameInput=document.getElementById('nameInput');
function askName(){
  nameInput.value='';
  namePrompt.classList.add('show');
  setTimeout(()=>nameInput.focus(), 50);
}
function closeName(){ namePrompt.classList.remove('show'); }
function submitName(){
  const v=(nameInput.value||'').trim().toLowerCase();
  closeName();
  if(v==='justin'){
    S.knowsCoatNum=true; sfx.good();
    toast('“Justin? Of course. Verified — your claim number is <b>57</b>.”',4200);
  } else if(v===''){
    toast('“…Hello? Is anyone there?” The line goes dead.');
  } else {
    sfx.bad(); toast('“Hm, that name’s not on our list. Goodbye.”',3200);
  }
}
document.getElementById('nameOk').onclick=submitName;
document.getElementById('nameCancel').onclick=()=>{ closeName(); };
nameInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ submitName(); } if(e.key==='Escape'){ closeName(); } });


function takeFromEnvelope(what){
  if(what==='card'){ S.has.card=true; sfx.pickup(); }
  if(what==='bluekey'){ S.has.bluekey=true; sfx.pickup(); }
  // once both are out, the envelope is empty — remove it and leave the page
  if(S.has.card && S.has.bluekey){
    S.has.envelope=false;
    const back=S._returnTo||'ceiling';
    setTimeout(()=>{ go(back); }, 400);
  }
  render();
}

function useKeyhole(){
  if(S.adminMode){ toast('The keypad is already powered on.'); return; }
  if(S.using==='key'){ S.adminMode=true; clearUsing(); sfx.key(); toast('You turn the key. You can place calls now.'); render(); }
  else if(S.using==='bluekey'){ sfx.bad(); toast('That key doesn’t fit this lock.'); }
  else { toast('A keyhole.'); }
}
function phoneDigit(d){ if(!S.adminMode){ sfx.bad(); toast('The keypad is dead.'); return; } sfx.phone(); if(phoneBuf.length<5){ phoneBuf+=d; updatePhoneReadout(); } }
function phoneAction(a){ if(!S.adminMode){ sfx.bad(); toast('The keypad is dead.'); return; }
  if(a==='clear'){ phoneBuf=''; dialState=null; updatePhoneReadout(); sfx.click(); }
  else if(a==='call'){ placeCall(phoneBuf); } }
function updatePhoneReadout(){
  const expected = (dialState==='maintenance_elev') ? 5 : (dialState==='maintenance_code') ? 3 : 3;
  if(phoneBuf===''){
    phoneReadout.textContent = Array(expected).fill('—').join(' ');
  } else {
    // show typed digits, then dashes for remaining expected slots
    const slots = Math.max(expected, phoneBuf.length);
    let out = phoneBuf.split('');
    while(out.length < slots) out.push('—');
    phoneReadout.textContent = out.join(' ');
  }
}

function placeCall(raw){
  sfx.click();
  // There is no 0 on the keypad — players must intuit that L (bottom-left, where 0 sits on a phone) is 0.
  const num = raw.replace(/L/g,'0');
  if(dialState==='maintenance_elev'){
    if(num===ANS.elevatorNum){ dialState='maintenance_code'; phoneBuf=''; toast('“Elevator confirmed. Now enter your 3-digit maintenance code.”',3800); }
    else { sfx.bad(); toast('“Not a valid elevator number. Goodbye.”'); dialState=null; phoneBuf=''; }
    updatePhoneReadout(); return;
  }
  if(dialState==='maintenance_code'){
    if(num===ANS.maintenanceCode){ sfx.good(); dialState=null; phoneBuf=''; S.screwdriverOnFloor=true;
      toast('“Code accepted. Dispatching a repair kit.”<br>You hear something clatter down the chute and drop onto the <b>floor</b>.',4800); }
    else { sfx.bad(); toast('“Incorrect maintenance code. Goodbye.”'); dialState=null; phoneBuf=''; }
    updatePhoneReadout(); return;
  }
  if(num==='505'){
    if(S.knowsCoatNum){ toast('“Your claim number is <b>57</b>.”',3600); }
    else { askName(); }   // popup: who referred you?
    phoneBuf=''; updatePhoneReadout(); return;
  }
  switch(num){
    case '101': toast('“Front desk. We’re away. Please leave a message.” <i>*beep*</i>'); break;
    case '202': toast('“You are calling from elevator <b>72561</b>. Outgoing calls are not available at this time. Thank you.”',4200); break;
    case '303': toast('“Automated maintenance line. Enter your <b>elevator number</b>, then your maintenance code.”',4200); dialState='maintenance_elev'; break;
    case '404': toast('“The bar is closed at this hour. Please call back later.”'); break;
    case ANS.finalCall:
      if(S.safeOpen){ toast('The line just rings now.'); break; }
      toast('“Going up. To unlock your booth, the combination is <b>elite</b>.”',4600); S._knowsFinalRiddle=true; break;
    default: sfx.bad(); toast('“We’re sorry, that extension is not recognized.”');
  }
  phoneBuf=''; updatePhoneReadout();
}

function positionSafeReadout(){
  const W=1280,H=720;
  // overlay the built-in dark display box above the keys (x 42.8-51%, y 46.7-52%)
  safeReadout.style.left =(0.432*W)+'px';
  safeReadout.style.top  =(0.468*H)+'px';
  safeReadout.style.width=(0.076*W)+'px';
  safeReadout.style.height=(0.05*H)+'px';
  safeReadout.style.lineHeight=(0.05*H)+'px';
  safeReadout.style.fontSize='17px';
  safeReadout.style.letterSpacing='3px';
  safeReadout.style.padding='0';
  safeReadout.style.border='none';
  safeReadout.style.background='transparent';
  safeReadout.style.boxShadow='none';
  safeReadout.style.color='#7CFC4E';
}
function updateSafeReadout(){ safeReadout.textContent=safeBuf.padEnd(4,'·'); }
function safeDigit(d){
  if(S.safeOpen) return; sfx.phone();
  if(safeBuf.length<4) safeBuf+=d; updateSafeReadout();
  if(safeBuf.length===4){
    if(safeBuf===ANS.safeCombo){ setTimeout(()=>{ S.safeOpen=true; sfx.good(); safeReadout.style.display='none'; toast('The safe clicks open.'); render(); },250); }
    else { setTimeout(()=>{ sfx.bad(); safeBuf=''; updateSafeReadout(); toast('Wrong combination.'); },250); }
  }
}

function screw(which){
  if(S.using!=='screwdriver'){
    toast('The grate is held by four screws.');
    return;
  }
  S.screws[which]=true; sfx.click();
  toast('Screw removed.',1500);
  render();
}

function go(scene){ current=scene; render(); }
function winGame(){ sfx.win(); document.getElementById('win').style.display='flex'; }

// Preload + decode every image and warm the alpha cache so pixel hit-testing
// is ready even immediately after a scene change (fixes first-click misses).
(function preloadAll(){
  const files=new Set();
  Object.values(SCENES).forEach(sc=>sc.layers.forEach(L=>files.add(L.f)));
  ['icon_key.png','icon_bluekey.png','icon_telescope.png','icon_screwdriver.png',
   'icon_envelope.png','icon_card.png','icon_directory.png'].forEach(f=>files.add(f));
  files.forEach(f=>{
    const im=new Image();
    im.onload=()=>{ try{
      const cv=document.createElement('canvas'); cv.width=AW; cv.height=AH;
      const ctx=cv.getContext('2d'); ctx.drawImage(im,0,0,AW,AH);
      _alphaCache[f.split('/').pop()]=ctx.getImageData(0,0,AW,AH).data;
    }catch(e){} };
    im.src=IMG+f;
  });
})();

render();
// scene-level click dispatcher (top-down pixel hit test)
stage.addEventListener('click', (e)=>{
  // ignore clicks on UI chrome (nav arrows, back btn, inventory, buttons)
  if(e.target.closest('.nav, .navback, #inv, #dbg, #win, #namePrompt')) return;
  sceneClick(e);
});
window.addEventListener('pointerdown',()=>{ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } },{once:true});
</script>
